name: Build and release RadialAltTab

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.21.0

      - name: Validate release version
        shell: pwsh
        run: |
          $source = Get-Content .\radial_tab.py -Raw
          $match = [regex]::Match($source, '(?m)^APP_VERSION = "([^"]+)"\r?$')
          if (-not $match.Success) { throw "APP_VERSION was not found" }
          if ($match.Groups[1].Value -ne $env:RELEASE_VERSION) {
            throw "APP_VERSION ($($match.Groups[1].Value)) must match release tag ($env:RELEASE_VERSION)"
          }

      - name: Run self-test
        shell: pwsh
        run: python radial_tab.py --self-test

      - name: Build Windows executable
        shell: pwsh
        run: .\build.ps1

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\RadialAltTab.exe)) {
            throw "dist\RadialAltTab.exe was not created"
          }

      - name: Create GitHub release and upload executable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_VERSION" `
            ".\dist\RadialAltTab.exe" `
            --repo "${{ github.repository }}" `
            --title "RadialAltTab $env:RELEASE_VERSION" `
            --generate-notes
